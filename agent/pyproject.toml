[project]
name = "sosforge-agent"
version = "1.0.0"
description = "SOSForge local agent -- real-time hazard alerts for this machine"
requires-python = ">=3.11"
dependencies = ["websockets>=13.0"]

[project.scripts]
sosforge-agent = "sosforge_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
