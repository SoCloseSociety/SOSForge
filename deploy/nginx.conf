# Cache policy per path, resolved ONCE here so that every add_header can live
# at server level. In nginx, an `add_header` inside a location REPLACES the
# whole inherited set instead of extending it: with Cache-Control added per
# location, the CSP, nosniff, Referrer-Policy and Permissions-Policy below
# were sent for /robots.txt and NOTHING ELSE -- not the shell, not the
# bundles, not the service worker. Measured with curl on the built image:
# "0 csp" on / and /assets/*, "1 csp" on /robots.txt. On the VPS the host
# nginx masks this with its own copy; any other deployment shipped without
# the protection this file says it provides.
map $uri $sos_cache_control {
    default                  "";
    # Content-hashed filenames: the same URL always means the same bytes, so
    # a year is safe and revalidation is pure latency. Without this, every
    # browser without the service worker -- a first visit, iOS before install,
    # a private window -- spends extra round trips on a network where a round
    # trip can be seconds.
    ~^/assets/               "public, max-age=31536000, immutable";
    # The shell, by contrast, changes at every build behind a stable URL. It
    # must never be held: that is the same defect the service worker had.
    /index.html              "no-cache";
    /sw.js                   "no-cache";
    /manifest.webmanifest    "no-cache";
    /favicon.ico             "public, max-age=604800";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------- headers
    #
    # These used to exist ONLY in the host nginx of one VPS, outside this
    # repository. Anything deployed from here -- a second host, the docker
    # stack on :8380, a rewritten vhost -- shipped with no Content-Security-
    # Policy at all, which is what stands between a hostile public feed and
    # the page. Nineteen feeds are rendered here and none of them is ours.
    #
    # connect-src carries the basemap host: MapLibre fetches vector tiles,
    # glyphs and sprites with fetch(), not <img>. Since 2026-09 that host is
    # tiles.openfreemap.org (CARTO's free raster tiles now answer with an
    # "API KEY REQUIRED" placeholder). The HOST nginx of the VPS carries its
    # own copy of this header and must be updated in step, or the browser
    # blocks every tile and the map is a black rectangle.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://tiles.openfreemap.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
    # Empty value = header omitted (nginx drops empty add_header values).
    add_header Cache-Control $sos_cache_control always;

    # No add_header in ANY location below: see the map at the top of this file.
    location /assets/ {
        try_files $uri =404;
    }

    # nginx has no MIME entry for .webmanifest, so it went out as
    # application/octet-stream. Set it HERE and not in a `types` block: a
    # `types` block REPLACES the inherited MIME table wholesale rather than
    # extending it, which sent every .js file out as octet-stream too. That
    # mistake shipped for one deploy.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Browsers and crawlers ask for this path without being told to. Before
    # this block it fell through to the SPA below and came back as a 200 HTML
    # page pretending to be an icon. The PNG is the same file the manifest
    # declares.
    location = /favicon.ico {
        alias /usr/share/nginx/html/icon-192.png;
        # The type is taken from the REQUESTED extension (.ico), not from the
        # aliased file: an empty `types` block here makes default_type win.
        types { }
        default_type image/png;
    }

    # SPA: toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://api:8300/healthz;
    }

    # Readiness, distinct from liveness: it answers 503 when too few sources
    # are up. Without this location it fell through to the SPA and returned
    # 200 with an HTML page, so any external monitor saw green whatever the
    # real state was -- the freshness rule broken at the monitoring layer.
    location /readyz {
        proxy_pass http://api:8300/readyz;
    }

    # Le websocket est le coeur du produit: pas de mise en tampon, et un timeout
    # de lecture large -- une connexion live reste ouverte des heures.
    location /ws {
        proxy_pass http://api:8300/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
