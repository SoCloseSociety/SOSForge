name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.32" "pydantic>=2.9" \
                      "pydantic-settings>=2.6" "httpx>=0.27" "websockets>=13.0" \
                      pytest pytest-asyncio ruff
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Tests
        # Aucun appel reseau: les fixtures sont des payloads reels captures.
        working-directory: backend
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer
        working-directory: frontend
        run: npm install
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
