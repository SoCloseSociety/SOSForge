name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # The suite takes about a minute. A hung test once held a runner for
    # 5 h 25 min (2026-10-28) before anyone looked; the default is 6 h.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # From pyproject.toml, not from a list copied into this file: the
        # hand-copied list had already drifted from it once (the Dockerfile
        # learnt the same lesson).
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Format
        # ruff is the project's only formatter (lessons.md, 22)
        working-directory: backend
        run: ruff format --check app tests

      - name: Types
        working-directory: backend
        run: mypy app
      - name: Tests
        # No network calls: the fixtures are captured real payloads.
        # faulthandler: a test still running after 120 s prints every
        # thread's stack, so a hang names itself instead of a bare timeout.
        working-directory: backend
        run: pytest tests -q -o faulthandler_timeout=120

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio ruff
      - name: Lint
        working-directory: agent
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        # The agent decides when to interrupt a person: its silence rules
        # and its escalation rules are the product, and they are tested here.
        working-directory: agent
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        # `npm ci`, from the lockfile: `npm install` resolves fresh versions,
        # so CI could test code the Dockerfile (which uses `npm ci`) never
        # builds.
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build
