services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SOS_DATA_DIR: /srv/data
    volumes:
      - sos-data:/srv/data
    restart: unless-stopped
    # pas de port publie: seul nginx parle a l'API
    expose:
      - '8300'

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      # Loopback uniquement: en production, seul le nginx de l'hote parle a ce
      # conteneur (il porte le TLS et le nom de domaine). L'exposer sur toutes
      # les interfaces publierait le site en HTTP clair sur un port de la machine.
      - '127.0.0.1:8380:80'
    volumes:
      # The Android APKs and latest.json, served under /download/ (see
      # deploy/nginx.conf and downloads/README.md). Read-only: nginx serves
      # them, only tools/publish_apk.py on the host writes them. Never baked
      # into the image -- a 39 MB binary per release has no place in git.
      - ./downloads:/srv/downloads:ro
    # The json-file driver keeps everything forever by default. The access
    # log no longer holds places (deploy/nginx.conf, sos_private), but an
    # unbounded log on a small VPS is a disk that fills; 3 x 10 MB is weeks.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

volumes:
  sos-data:
