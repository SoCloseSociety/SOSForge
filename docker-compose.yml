services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SOS_DATA_DIR: /srv/data
    volumes:
      - sos-data:/srv/data
    restart: unless-stopped
    # pas de port publie: seul nginx parle a l'API
    expose:
      - '8300'
    # A hard ceiling, so an overrun is paid inside this container and never
    # by the neighbours on the VPS (about 600-700 MB available, swap 3.2 of
    # 6 GB already used, 2026-10-27). Sized from measurements, in MiB (what
    # `m` means here), with every byte-bounded part at its bound at once:
    #   290  the steady API (220-290 measured in production, the high end)
    # + 144  the place caches at their byte bounds (history 64 + MET Norway
    #        64 + NWS grid 16), counted again in full on top of the steady
    # +  22  the IBTrACS index (22.7 MB) loaded twice while a rebuild swaps it
    # + 100  the process that rebuilds it each time NCEI publishes a new
    #        file: 78-87 MiB peak RSS since 2026-10-28 (360-363 before),
    #        /usr/bin/time -l on the 333 MB file of 2026-10-27
    # = 556. 640m leaves 84 over that and 350 over the steady API, and keeps
    # SOSForge's own growth well inside what the host has available. Not in
    # the sum, because nothing bounds them in bytes: the per-place caches
    # bounded by entry count (GWIS tiles, SST, om cells, points, water,
    # INFORM), the websocket queues (QUEUE_MAX per client, no cap on
    # clients), the kernel's socket memory and the healthcheck's python
    # every 30 s. The 84 of margin is for those. The page cache of the
    # 333 MB CSV is charged here too, but the kernel reclaims it before it
    # kills anything.
    # If the ceiling is reached anyway, the kernel's OOM killer chooses
    # inside this cgroup only: the task with the most RSS + swap + page
    # tables, plus oom_score_adj thousandths of the limit (mm/oom_kill.c).
    # The build process raises its own oom_score_adj to 1000, so it is
    # killed first whatever the sizes; the API keeps serving and
    # history.cyclones says why (`build_failed`), retried after the 10 min to
    # 6 h backoff, or at the next 24 h check when an index is already served.
    # Only an overrun by the API itself restarts the container.
    # memswap_limit equal to mem_limit: no swap for this container either,
    # or it would still push its own pages into the swap the neighbours use.
    mem_limit: 640m
    memswap_limit: 640m

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      # Loopback uniquement: en production, seul le nginx de l'hote parle a ce
      # conteneur (il porte le TLS et le nom de domaine). L'exposer sur toutes
      # les interfaces publierait le site en HTTP clair sur un port de la machine.
      - '127.0.0.1:8380:80'
    volumes:
      # The Android APKs and latest.json, served under /download/ (see
      # deploy/nginx.conf and downloads/README.md). Read-only: nginx serves
      # them, only tools/publish_apk.py on the host writes them. Never baked
      # into the image -- a 39 MB binary per release has no place in git.
      - ./downloads:/srv/downloads:ro
    # The json-file driver keeps everything forever by default. The access
    # log no longer holds places (deploy/nginx.conf, sos_private), but an
    # unbounded log on a small VPS is a disk that fills; 3 x 10 MB is weeks.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

volumes:
  sos-data:
